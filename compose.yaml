name: win7folio

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
    environment:
      VITE_DOOM_URL: ${VITE_DOOM_URL:-http://localhost:8090}
      VITE_COLLABORA_URL: ${VITE_COLLABORA_URL:-http://localhost:9980}
    depends_on:
      - doom-wasm
      - documents
      - collabora
    networks:
      - portfolio

  doom-wasm:
    build:
      context: ./doom-wasm
      dockerfile: Dockerfile
    ports:
      - "${DOOM_PORT:-8080}:80"
    networks:
      - portfolio

  documents:
    build:
      context: .
      dockerfile: documents/Dockerfile
    environment:
      COLLABORA_INTERNAL_URL: http://collabora:9980
      WOPI_BASE_URL: http://documents:3000
      USER_DOCUMENTS_ROOT: /source/C:/User/Document
    volumes:
      - ./public/documents:/documents:ro
      - type: bind
        source: ./src
        target: /source
        read_only: true
    networks:
      - portfolio

  collabora:
    build:
      context: ./collabora
      dockerfile: Dockerfile
    environment:
      aliasgroup1: http://documents:3000
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:welcome.enable=false
    cap_add:
      - MKNOD
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    networks:
      - portfolio

networks:
  portfolio:
